<svg xmlns="http://www.w3.org/2000/svg" width="840" height="462" viewBox="0 0 840 462" role="img" aria-label="Ghostty themed with SP Night Noite Paulista">
  <style>.mono { font: 15px ui-monospace, 'JetBrains Mono', 'Fira Code', Menlo, monospace; }</style>
  <rect width="840" height="462" rx="12" fill="#151723"/>
  <rect x="0.5" y="0.5" width="839" height="461" rx="11.5" fill="none" stroke="#373943"/>
  <path d="M0 12a12 12 0 0 1 12-12h816a12 12 0 0 1 12 12v30H0z" fill="#1d1f2d"/>
  <line x1="0" y1="42.5" x2="840" y2="42.5" stroke="#373943"/>
  <circle cx="24" cy="21" r="5.5" fill="#ea5d5d"/>
  <circle cx="42" cy="21" r="5.5" fill="#f5c66b"/>
  <circle cx="60" cy="21" r="5.5" fill="#89d093"/>
  <text x="420" y="26" text-anchor="middle" class="mono" fill="#707380">ghostty — sp_night_noite</text>
  <text x="26" y="82" xml:space="preserve" class="mono"><tspan fill="#f2984a">~/sp-night </tspan><tspan fill="#f5c66b">(main) </tspan><tspan fill="#6e92de">❯ </tspan><tspan fill="#d3d7eb">ghostty +show-config | grep theme</tspan></text>
  <text x="26" y="108" xml:space="preserve" class="mono"><tspan fill="#d3d7eb">theme = sp_night_noite</tspan></text>
  <text x="26" y="160" xml:space="preserve" class="mono"><tspan fill="#f2984a">~/sp-night </tspan><tspan fill="#6e92de">❯ </tspan><tspan fill="#d3d7eb">cat theme.lua</tspan></text>
  <text x="26" y="186" xml:space="preserve" class="mono"><tspan fill="#868999">-- the sodium lamp that turns the whole city this colour</tspan></text>
  <text x="26" y="212" xml:space="preserve" class="mono"><tspan fill="#6e92de">local </tspan><tspan fill="#d3d7eb">palette </tspan><tspan fill="#5dbec4">= </tspan><tspan fill="#6e92de">require</tspan><tspan fill="#868999">(</tspan><tspan fill="#89d093">"sp_night.palette"</tspan><tspan fill="#868999">)</tspan></text>
  <text x="26" y="238" xml:space="preserve" class="mono"><tspan fill="#6e92de">if </tspan><tspan fill="#f5c66b">vim</tspan><tspan fill="#d3d7eb">.o.background </tspan><tspan fill="#5dbec4">~= </tspan><tspan fill="#89d093">"dark" </tspan><tspan fill="#6e92de">then return </tspan><tspan fill="#f2984a">nil</tspan><tspan fill="#868999">, </tspan><tspan fill="#89d093">"dark only, by decision" </tspan><tspan fill="#6e92de">end</tspan></text>
  <text x="26" y="290" xml:space="preserve" class="mono"><tspan fill="#f2984a">~/sp-night </tspan><tspan fill="#6e92de">❯ </tspan><tspan fill="#d3d7eb">spn check</tspan></text>
  <text x="26" y="316" xml:space="preserve" class="mono"><tspan fill="#89d093">✓ </tspan><tspan fill="#d3d7eb">contrast   </tspan><tspan fill="#868999">70 pairs per flavour, AA on every surface</tspan></text>
  <text x="26" y="342" xml:space="preserve" class="mono"><tspan fill="#89d093">✓ </tspan><tspan fill="#d3d7eb">accents    </tspan><tspan fill="#868999">separation ΔE ≥ 0.10 or ΔL ≥ 0.04</tspan></text>
  <text x="26" y="384" class="mono" fill="#707380" font-size="12">palette 0–15</text>
  <rect x="26.0" y="396" width="43.6" height="26" rx="4" fill="#0f101a"/>
  <rect x="75.6" y="396" width="43.6" height="26" rx="4" fill="#ea5d5d"/>
  <rect x="125.3" y="396" width="43.6" height="26" rx="4" fill="#89d093"/>
  <rect x="174.9" y="396" width="43.6" height="26" rx="4" fill="#f5c66b"/>
