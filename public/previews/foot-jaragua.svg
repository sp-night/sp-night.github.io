  <text x="420" y="26" text-anchor="middle" class="mono" fill="#707471">foot — sp_night_jaragua</text>
  <text x="26" y="82" xml:space="preserve" class="mono"><tspan fill="#f2984a">~/sp-night </tspan><tspan fill="#f5c66b">(main) </tspan><tspan fill="#6e92de">❯ </tspan><tspan fill="#d3dad5">grep include ~/.config/foot/foot.ini</tspan></text>
  <text x="26" y="108" xml:space="preserve" class="mono"><tspan fill="#f5c66b">include</tspan><tspan fill="#60bfb8">=</tspan><tspan fill="#79d488">~/.config/foot/sp_night_jaragua.ini</tspan></text>
  <text x="26" y="160" xml:space="preserve" class="mono"><tspan fill="#f2984a">~/sp-night </tspan><tspan fill="#6e92de">❯ </tspan><tspan fill="#d3dad5">grep -cE '^(regular|bright)[0-7]=' ~/.config/foot/sp_night_jaragua.ini</tspan></text>
  <text x="26" y="186" xml:space="preserve" class="mono"><tspan fill="#f2984a">16</tspan></text>
  <text x="26" y="238" xml:space="preserve" class="mono"><tspan fill="#f2984a">~/sp-night </tspan><tspan fill="#6e92de">❯ </tspan><tspan fill="#d3dad5">spn check</tspan></text>
  <text x="26" y="264" xml:space="preserve" class="mono"><tspan fill="#79d488">✓ </tspan><tspan fill="#d3dad5">contrast   </tspan><tspan fill="#868b87">70 pairs per flavour, AA on every surface</tspan></text>
  <text x="26" y="290" xml:space="preserve" class="mono"><tspan fill="#79d488">✓ </tspan><tspan fill="#d3dad5">accents    </tspan><tspan fill="#868b87">separation ΔE ≥ 0.10 or ΔL ≥ 0.04</tspan></text>
  <text x="26" y="384" class="mono" fill="#707471" font-size="12">regular0–7 / bright0–7</text>
