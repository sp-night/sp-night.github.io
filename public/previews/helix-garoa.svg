  <text x="26" y="160" xml:space="preserve" class="mono"><tspan fill="#767d88">  4 </tspan><tspan fill="#414346">│ </tspan><tspan fill="#7993cb">pub fn </tspan><tspan fill="#77babf">flavours</tspan><tspan fill="#8d949f">() </tspan><tspan fill="#77babf">-&gt; </tspan><tspan fill="#af97d3">Vec</tspan><tspan fill="#8d949f">&lt;&amp;</tspan><tspan fill="#7993cb">'static </tspan><tspan fill="#af97d3">str</tspan><tspan fill="#8d949f">&gt; {</tspan></text>
  <text x="26" y="186" xml:space="preserve" class="mono"><tspan fill="#767d88">  5 </tspan><tspan fill="#414346">│     </tspan><tspan fill="#56b19f">vec!</tspan><tspan fill="#8d949f">[</tspan><tspan fill="#9acaa2">"noite"</tspan><tspan fill="#8d949f">, </tspan><tspan fill="#9acaa2">"garoa"</tspan><tspan fill="#8d949f">, </tspan><tspan fill="#9acaa2">"jaragua"</tspan><tspan fill="#8d949f">]</tspan></text>
  <text x="26" y="212" xml:space="preserve" class="mono"><tspan fill="#767d88">  6 </tspan><tspan fill="#414346">│ </tspan><tspan fill="#8d949f">}</tspan></text>
  <text x="26" y="264" xml:space="preserve" class="mono"><tspan fill="#767d88">    </tspan><tspan fill="#d87676">● </tspan><tspan fill="#8d949f">expected `;`, found `}`</tspan></text>
