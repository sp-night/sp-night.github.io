  <text x="26" y="82" xml:space="preserve" class="mono"><tspan fill="#767d88">  1 </tspan><tspan fill="#414346">│ </tspan><tspan fill="#7993cb">use </tspan><tspan fill="#af97d3">std</tspan><tspan fill="#8d949f">::</tspan><tspan fill="#af97d3">collections</tspan><tspan fill="#8d949f">::</tspan><tspan fill="#af97d3">HashMap</tspan><tspan fill="#8d949f">;</tspan></text>
