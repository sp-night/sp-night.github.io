  <text x="420" y="26" text-anchor="middle" class="mono" fill="#707471">alacritty - sp_night_jaragua</text>
  <text x="26" y="82" xml:space="preserve" class="mono"><tspan fill="#f2984a">~/sp-night </tspan><tspan fill="#f5c66b">(main) </tspan><tspan fill="#6e92de">❯ </tspan><tspan fill="#d3dad5">cat themes/sp_night_jaragua.toml</tspan></text>
  <text x="26" y="108" xml:space="preserve" class="mono"><tspan fill="#b094e2">[colors.primary]</tspan></text>
  <text x="26" y="134" xml:space="preserve" class="mono"><tspan fill="#f5c66b">background</tspan><tspan fill="#60bfb8">     = </tspan><tspan fill="#79d488">"#0c100d"</tspan></text>
  <text x="26" y="160" xml:space="preserve" class="mono"><tspan fill="#f5c66b">foreground</tspan><tspan fill="#60bfb8">     = </tspan><tspan fill="#79d488">"#d3dad5"</tspan></text>
  <text x="26" y="186" xml:space="preserve" class="mono"><tspan fill="#f5c66b">dim_foreground</tspan><tspan fill="#60bfb8"> = </tspan><tspan fill="#79d488">"#868b87"</tspan></text>
  <text x="26" y="238" xml:space="preserve" class="mono"><tspan fill="#b094e2">[colors.cursor]</tspan></text>
  <text x="26" y="264" xml:space="preserve" class="mono"><tspan fill="#f5c66b">cursor</tspan><tspan fill="#60bfb8"> = </tspan><tspan fill="#79d488">"#f2984a"</tspan></text>
  <text x="26" y="290" xml:space="preserve" class="mono"><tspan fill="#f5c66b">text</tspan><tspan fill="#60bfb8">   = </tspan><tspan fill="#79d488">"#050806"</tspan></text>
  <text x="26" y="342" xml:space="preserve" class="mono"><tspan fill="#f2984a">~/sp-night </tspan><tspan fill="#6e92de">❯ </tspan><tspan fill="#d3dad5">grep -n import ~/.config/alacritty/alacritty.toml</tspan></text>
  <text x="26" y="368" xml:space="preserve" class="mono"><tspan fill="#707471">2:</tspan><tspan fill="#f5c66b">import</tspan><tspan fill="#868b87"> = [</tspan><tspan fill="#79d488">"~/.config/alacritty/themes/sp_night_jaragua.toml"</tspan><tspan fill="#868b87">]</tspan></text>
  <text x="26" y="420" xml:space="preserve" class="mono"><tspan fill="#f2984a">~/sp-night </tspan><tspan fill="#6e92de">❯ </tspan><tspan fill="#d3dad5">spn check</tspan></text>
  <text x="26" y="446" xml:space="preserve" class="mono"><tspan fill="#79d488">✓ </tspan><tspan fill="#d3dad5">contrast   </tspan><tspan fill="#868b87">70 pairs per flavour, AA on every surface</tspan></text>
  <text x="26" y="472" xml:space="preserve" class="mono"><tspan fill="#79d488">✓ </tspan><tspan fill="#d3dad5">accents    </tspan><tspan fill="#868b87">separation ΔE ≥ 0.10 or ΔL ≥ 0.04</tspan></text>
